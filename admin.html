<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Content Dashboard | Iqbal Baihaqi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#0a0a0a; --dark-light:#141414; --dark-card:#1b1b1b; --line:#2a2a2a;
  --accent:#00ff88; --accent-dim:#00cc6a; --text:#ffffff; --muted:#a1a1aa;
  --danger:#ff5468; --warn:#ffb020;
  --display:'Clash Display',sans-serif; --body:'Satoshi',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--dark);color:var(--text);font-family:var(--body);font-size:14px;overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:250px 1fr;grid-template-rows:auto 1fr;height:100vh}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 20px;height:60px;
  background:var(--dark-light);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
.brand span{color:var(--accent)}
.topbar .spacer{flex:1}

.sidebar{background:var(--dark-light);border-right:1px solid var(--line);overflow-y:auto;padding:12px 0}
.side-label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);
  padding:14px 20px 8px;text-transform:uppercase}
.side-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 20px;text-align:left;
  color:var(--muted);border-left:2px solid transparent;transition:.15s}
.side-item:hover{color:var(--text);background:#ffffff08}
.side-item.active{color:var(--accent);border-left-color:var(--accent);background:#00ff8810}
.side-item .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);
  background:#ffffff0d;padding:1px 7px;border-radius:20px}
.side-item.active .count{background:#00ff8820;color:var(--accent)}

.main{overflow-y:auto;padding:28px 32px 80px}
.main-head{margin-bottom:24px}
.main-head h1{font-family:var(--display);font-size:26px;font-weight:600;letter-spacing:-.02em}
.main-head p{color:var(--muted);margin-top:5px;font-size:13px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:7px;
  border:1px solid var(--line);background:var(--dark-card);font-weight:500;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#3d3d3d;background:#242424}
.btn-primary{background:var(--accent);color:#04150c;border-color:var(--accent);font-weight:700}
.btn-primary:hover{background:var(--accent-dim);border-color:var(--accent-dim)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-icon{padding:5px 8px;border-radius:6px;color:var(--muted);font-size:13px;line-height:1}
.btn-icon:hover{color:var(--text);background:#ffffff12}
.btn-icon.danger:hover{color:var(--danger);background:#ff546818}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- status pill ---------- */
.status{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;
  color:var(--muted);padding:5px 11px;border-radius:20px;background:#ffffff08;white-space:nowrap}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status.saved .dot{background:var(--accent)}
.status.saved{color:var(--accent)}
.status.dirty .dot{background:var(--warn)}
.status.dirty{color:var(--warn)}

/* ---------- fields ---------- */
.field{margin-bottom:16px}
.field > label:not(.check){display:block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  color:var(--muted);margin-bottom:6px;text-transform:uppercase}
.field .hint{font-size:11px;color:#71717a;margin-top:5px;font-family:var(--mono)}
.control{width:100%;padding:10px 12px;background:var(--dark);border:1px solid var(--line);
  border-radius:7px;color:var(--text);transition:.15s}
.control:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #00ff8815}
.control::placeholder{color:#52525b}
textarea.control{resize:vertical;min-height:88px;line-height:1.55}
select.control{cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}

/* checkbox */
.check{display:flex;align-items:center;gap:10px;cursor:pointer;padding:9px 0}
.check input{appearance:none;width:38px;height:21px;border-radius:20px;background:#333;position:relative;
  cursor:pointer;transition:.2s;flex-shrink:0}
.check input:checked{background:var(--accent)}
.check input::after{content:'';position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;
  background:#fff;transition:.2s}
.check input:checked::after{transform:translateX(17px);background:#04150c}
.check span{font-size:13px}

/* color field */
.color-row{display:flex;gap:9px;align-items:center}
.color-row input[type=color]{width:42px;height:40px;padding:3px;background:var(--dark);
  border:1px solid var(--line);border-radius:7px;cursor:pointer;flex-shrink:0}

/* tags (string array) */
.tags{display:flex;flex-wrap:wrap;gap:7px;padding:9px;background:var(--dark);
  border:1px solid var(--line);border-radius:7px;min-height:44px;align-items:flex-start}
.tag{display:inline-flex;align-items:center;gap:6px;background:#00ff8814;color:var(--accent);
  border:1px solid #00ff8830;padding:4px 9px;border-radius:5px;font-size:12px;font-family:var(--mono)}
.tag button{color:var(--accent);opacity:.6;font-size:14px;line-height:1}
.tag button:hover{opacity:1}
.tags input{flex:1;min-width:130px;background:none;border:none;color:var(--text);padding:4px;outline:none}
.tags input::placeholder{color:#52525b}

/* image preview */
.img-preview{display:flex;gap:12px;align-items:flex-start;margin-top:9px}
.img-frame{width:100px;height:100px;border:1px solid var(--line);border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  /* checkerboard so transparent PNGs read correctly on a dark surface */
  background-image:linear-gradient(45deg,#1e1e1e 25%,transparent 25%,transparent 75%,#1e1e1e 75%),
                   linear-gradient(45deg,#1e1e1e 25%,transparent 25%,transparent 75%,#1e1e1e 75%);
  background-size:14px 14px;background-position:0 0,7px 7px;background-color:#141414}
.img-frame.empty{border-style:dashed;background-image:none;background-color:var(--dark)}
.img-frame img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.img-frame .ph{font-size:22px;opacity:.25}
.img-meta{font-family:var(--mono);font-size:11px;line-height:1.7;color:var(--muted);min-width:0;
  overflow-wrap:anywhere;padding-top:1px}
.img-meta .ok{color:var(--accent)}
.img-meta .err{color:var(--danger)}
.img-meta a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.img-meta a:hover{color:var(--accent)}
.img-frame.loading{opacity:.5}
/* Plain-text values keep only the note — an empty frame would look like a broken image. */
.img-preview.text-only .img-frame{display:none}
.img-preview.text-only{margin-top:5px}

/* string list (multi-line entries) */
.slist-row{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.slist-row .control{flex:1}

/* ---------- array item cards ---------- */
.card{background:var(--dark-light);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;
  overflow:hidden}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.card-head:hover{background:#ffffff06}
.card-head .chev{color:var(--muted);font-size:11px;transition:.2s;width:12px;flex-shrink:0}
.card.open > .card-head .chev{transform:rotate(90deg)}
.card-head .idx{font-family:var(--mono);font-size:11px;color:var(--muted);background:#ffffff0d;
  padding:2px 7px;border-radius:4px;flex-shrink:0}
.card-head .title{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-head .badge{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:4px;
  background:#00ff8814;color:var(--accent);flex-shrink:0}
.card-actions{display:flex;gap:2px;flex-shrink:0}
/* Child selectors, not descendant: an open card must not expand its nested cards. */
.card > .card-body{padding:4px 16px 16px;border-top:1px solid var(--line);display:none}
.card.open > .card-body{display:block}

.subsection{border:1px dashed var(--line);border-radius:9px;padding:14px;margin-bottom:16px;background:#00000030}
.subsection > h4{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);
  text-transform:uppercase;margin-bottom:12px}

.empty{padding:36px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}

/* ---------- json preview drawer ---------- */
.drawer{position:fixed;top:0;right:0;width:min(560px,92vw);height:100vh;background:var(--dark-light);
  border-left:1px solid var(--line);transform:translateX(100%);transition:.28s cubic-bezier(.4,0,.2,1);
  z-index:60;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer-head h3{font-family:var(--display);font-size:16px;font-weight:600;flex:1}
.drawer pre{flex:1;overflow:auto;padding:18px 20px;font-family:var(--mono);font-size:12px;
  line-height:1.65;color:#c4c4c8;white-space:pre-wrap;word-break:break-word}
.backdrop{position:fixed;inset:0;background:#000000aa;z-index:55;opacity:0;pointer-events:none;transition:.28s}
.backdrop.open{opacity:1;pointer-events:auto}

/* ---------- toast ---------- */
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,90px);z-index:90;
  background:var(--dark-card);border:1px solid var(--line);border-left:3px solid var(--accent);
  padding:13px 20px;border-radius:9px;box-shadow:0 10px 40px #000c;transition:.3s;opacity:0;max-width:90vw}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.err{border-left-color:var(--danger)}

/* ---------- loading / gate ---------- */
.gate{position:fixed;inset:0;background:var(--dark);z-index:100;display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:18px;padding:24px;text-align:center}
.gate h2{font-family:var(--display);font-size:22px;font-weight:600}
.gate p{color:var(--muted);max-width:440px;line-height:1.6}
.gate.hidden{display:none}

/* Section switcher that replaces the sidebar on narrow screens. */
.mobile-sections{display:none;margin-bottom:20px}

@media(max-width:760px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .mobile-sections{display:block}
  .main{padding:20px 16px 80px}
  /* Let the toolbar wrap instead of forcing the page wider than the viewport. */
  .topbar{flex-wrap:wrap;height:auto;min-height:60px;padding:10px 14px;gap:8px}
  .topbar .spacer{display:none}
  .brand{font-size:15px}
  .status{min-width:0}
  .btn-sm{padding:6px 10px;font-size:12px}
  .main-head h1{font-size:21px}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <h2>Memuat <span style="color:var(--accent)">data.json</span>…</h2>
  <p id="gate-msg">Menghubungi sumber data lokal.</p>
  <div id="gate-actions" style="display:none;gap:10px;flex-wrap:wrap;justify-content:center">
    <label class="btn btn-primary" style="cursor:pointer">
      Pilih data.json manual
      <input type="file" id="file-input" accept=".json,application/json" hidden>
    </label>
    <button class="btn" id="gate-retry">Coba lagi</button>
  </div>
</div>

<div class="app">
  <header class="topbar">
    <div class="brand">CONTENT<span>.</span>DASHBOARD</div>
    <div class="status" id="status"><span class="dot"></span><span id="status-text">memuat…</span></div>
    <div class="spacer"></div>
    <button class="btn btn-sm" id="btn-json">{ } Lihat JSON</button>
    <button class="btn btn-sm" id="btn-reset">Reset</button>
    <button class="btn btn-sm" id="btn-copy">Copy JSON</button>
    <button class="btn btn-sm btn-primary" id="btn-download">↓ Download data.json</button>
  </header>

  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h3>data.json</h3>
    <span class="status" id="json-size"></span>
    <button class="btn-icon" id="drawer-close">✕</button>
  </div>
  <pre id="json-preview"></pre>
</aside>

<div class="toast" id="toast"></div>

<script src="admin.js"></script>
</body>
</html>
